[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zidian"
version = "1.0.0"
description = "Reproduce NP Manager's 字典 (dictionary) identifier obfuscation: generate hardened dictionaries and apply/undo ProGuard-style renaming."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["obfuscation", "proguard", "dex", "android", "dictionary", "npmanager"]

[project.scripts]
zidian = "zidian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zidian = ["py.typed"]
